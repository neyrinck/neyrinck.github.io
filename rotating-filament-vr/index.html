<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020208" />
    <title>Rotating Filament — Light Field Prototype</title>
    <script type="module" crossorigin src="/rotating-filament-vr/assets/index-BtjdOYzy.js"></script>
    <link rel="stylesheet" crossorigin href="/rotating-filament-vr/assets/index-DiiSGlBE.css">
  </head>
  <body class="hud-hidden">
    <canvas id="scene"></canvas>

    <aside id="hud" aria-label="Desktop controls">
      <div class="hud-header">
        <div class="title">ROTATING FILAMENT</div>
        <button id="hideHud" class="hud-visibility" type="button" aria-label="Hide controls">hide</button>
      </div>
      <div class="subtitle">light-field / WebXR prototype · v0.22</div>

      <button id="recenterView" class="wide-toggle" type="button">recenter outside view</button>

      <label>
        Time scale <span id="speedValue">1.00×</span>
        <input id="speed" type="range" min="0" max="2.5" step="0.05" value="1" />
      </label>

      <label>
        Flow coherence <span id="coherenceValue">0.82</span>
        <input id="coherence" type="range" min="0" max="1" step="0.01" value="0.82" />
      </label>

      <label>
        Beam opacity <span id="beamOpacityValue">0.020</span>
        <input id="beamOpacity" type="range" min="0" max="0.40" step="0.005" value="0.020" />
      </label>

      <label>
        Gas-column beam fraction <span id="gasFractionValue">25%</span>
        <input id="gasFraction" type="range" min="0" max="1" step="0.01" value="0.25" />
      </label>

      <label>
        Gas filament thickness <span id="gasThicknessValue">1.00×</span>
        <input id="gasThickness" type="range" min="0" max="1.5" step="0.01" value="1" />
      </label>

      <label>
        Galaxy blob opacity <span id="blobOpacityValue">0.55</span>
        <input id="blobOpacity" type="range" min="0" max="1" step="0.01" value="0.55" />
      </label>

      <div class="row toggles">
        <button id="toggleBeams" class="active">beams</button>
        <button id="toggleFixtures" class="active">wall lights</button>
        <button id="toggleBlobs">blobs</button>
        <button id="toggleSound">sound</button>
      </div>

      <button id="toggleSkyPlane" class="wide-toggle" type="button">project to sky plane (x = 0)</button>
      <button id="resetGalaxiesT0" class="wide-toggle" type="button">reset galaxies to t = 0</button>

      <div class="hint">Click near a galaxy for observed properties · Drag to orbit · scroll to zoom · R to recenter · Enter VR for Quest</div>
    </aside>

    <button id="showHud" class="hud-show" type="button" aria-label="Show controls">controls</button>

    <aside id="galaxyInfoCard" class="galaxy-info-card" hidden aria-live="polite">
      <button id="closeGalaxyInfo" class="galaxy-info-close" type="button" aria-label="Close galaxy information">×</button>
      <div id="galaxyInfoContent"></div>
    </aside>

    <div id="status">Earth = −x · plane of sky = yz · LOS depth is interpretive</div>
  </body>
</html>
